sonar.projectKey=cambridge-academy
sonar.projectName=Cambridge Academy
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Analisis completo del codigo fuente
sonar.sources=ca_program,database,main.py,setup.py
sonar.tests=sonar_tests

# Coverage real generado por coverage.py en formato Cobertura XML
sonar.python.coverage.reportPaths=coverage.xml

# Exclusiones de analisis: archivos temporales, documentacion y binarios
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/venv/**,**/.venv/**,**/build/**,**/dist/**,docs/**,**/*.docx,**/*.xlsx,**/*.png,run.bat

# La cobertura se concentra en las entidades de dominio, que no dependen de GUI ni base de datos.
# La GUI, modelos de persistencia y scripts de arranque se analizan por calidad, pero no se computan en coverage.
sonar.coverage.exclusions=ca_program/views/**,ca_program/models/**,ca_program/services/**,database/**,main.py,setup.py
